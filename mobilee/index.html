<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
              * {
          padding: 0;
          margin: 0;
          box-sizing: border-box;
      }
      .main {
          width: 100%;
          height: 100vh;
      }

      header {
          width: 1440px;
          height: 60px;
          margin: 10px auto;
          background-color: aqua;
          border-radius: 30px;
      }
      header ul li {
          list-style: none;
      }
      header ul {
          width: 100%;
          height: 60px;
          display: flex;
          justify-content: space-evenly;
          align-items: center;
      }
      header a {
          text-decoration: none;
          color: black;
      }

      .cards {
          width: 1440px;
          height: 600px;
          margin: auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 10px;
          border: 20px solid blue;

      }
      .cards .a {
          background-color: red;
          width: 300px;
          height: 500px;
      }
      .cards .b {
          background-color: yellow;
          width: 300px;
          height: 500px;
      }
      .cards .c {
          background-color: green;
          width: 300px;
          height: 500px;
      }
      .cards .d {
          background-color: magenta;
          width: 300px;
          height: 500px;
      }

      @media (max-width: 1200px){
          .cards {
              display: flex;
              flex-direction: column;
              justify-content: space-between;
              align-items: center;
              height: 1000px;
              border: 20px solid blue;
          }
          .cards .card {
              width: 800px;
              height: 800px;
          }

      @media (max-width: 700px){
          .cards .card {
              width: 1440px;
              height: 300px;
              border-radius: 50%;
          }
      }
    </style>
  </head>
  <body>
    <div class="main">
      <header>
        <ul>
          <li><a href="#">Bosh sahifa</a></li>
          <li><a href="#">Kurslar</a></li>
          <li><a href="#">Biz haqimizda</a></li>
        </ul>
      </header>
      <div class="cards">
        <div class="card a"><h2>Lorem, ipsum dolor.</h2></div>
        <div class="card b"><h2>Lorem, ipsum dolor.</h2></div>
        <div class="card c"><h2>Lorem, ipsum dolor.</h2></div>
        <div class="card d"><h2>Lorem, ipsum dolor.</h2></div>
        <div class="card d"><h2>Lorem, ipsum dolor.</h2></div>
        <div class="card d"><h2>Lorem, ipsum dolor.</h2></div>
      </div>
    </div>
  </body>
</html>
